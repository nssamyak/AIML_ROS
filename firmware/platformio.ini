; PlatformIO build for the ESP32 base controller.
; Arduino IDE users: just open esp32_kiwi_base/esp32_kiwi_base.ino instead.
;
;   pio run -t upload        build and flash
;   pio device monitor       serial monitor (type V,2,2,2 or M,120,0,0)

[platformio]
src_dir = esp32_kiwi_base

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_eol = LF
